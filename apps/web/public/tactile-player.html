eo.pts, tubeW: armGeo.w,\n      tubeShadowW: armGeo.w ? armGeo.w + 2 : 0, tubeHiW: armGeo.w ? Math.max(1.5, armGeo.w * 0.3) : 0,\n      headT: armGeo.headT, cwT: armGeo.cwT,\n      isCustom: page === \"custom\",\n      goCustom: () => this.setState({ page: \"custom\" }),\n      resetCfg: () => this.setState({ cfg: {} }),\n      cfgGroups: groupDefs.map(([label, key]) => ({\n        label,\n        opts: Object.keys(V[key]).map(name => {\n          const on = cfg(key) === name;\n          return {\n            name,\n            bg: on ? this.btnV.pressed : this.btnV.face,\n            ink: on ? this.btnV.inkOn : this.btnV.ink,\n            shadow: on ? \"inset 0 3px 6px rgba(0,0,0,0.45)\" : \"0 3px 6px rgba(0,0,0,0.35),inset 0 1px 1px rgba(255,255,255,0.5)\",\n            led: on ? \"radial-gradient(circle at 35% 30%, #ffd27a, #e8933c)\" : \"rgba(0,0,0,0.25)\",\n            ledGlow: on ? \"0 0 6px rgba(232,147,60,0.9)\" : \"inset 0 1px 1px rgba(0,0,0,0.4)\",\n            pick: () => this.setState(s => ({ cfg: Object.assign({}, s.cfg, { [key]: name }) }))\n          };\n        })\n      })),\n      isPlay: page === \"play\", isSearch: page === \"search\", isMe: page === \"me\",\n      goPlay: () => this.setState({ page: \"play\" }),\n      goSearch: () => this.setState({ page: \"search\" }),\n      goMe: () => this.setState({ page: \"me\" }),\n      tabPlay: this.tab(\"play\"), tabSearch: this.tab(\"search\"), tabMe: this.tab(\"me\"),\n      title: tr.t, artist: tr.a, trackNo: idx + 1,\n      playStateLabel: playing ? \"正在播放\" : \"已暂停\",\n      curTime: fmt(sec), remTime: \"-\" + fmt(tr.d - sec),\n      progressPct: (sec / tr.d * 100).toFixed(1) + \"%\",\n      volPct: Math.round(vol * 100) + \"%\",\n      spinState: playing && !swap ? \"running\" : \"paused\",\n      armDeg: playing && !swap ? \"0deg\" : \"-16deg\",\n      discAnim: swap === \"out\" ? (this.state.swapDir === \"back\" ? \"discOutR\" : \"discOutL\") + \" 0.47s cubic-bezier(.45,.1,.7,1) forwards\" : swap === \"in\" ? (this.state.swapDir === \"back\" ? \"discInL\" : \"discInR\") + \" 0.53s cubic-bezier(.25,.8,.3,1) both\" : \"none\",\n      playPath: playing ? \"M7 4.5h3.4v15H7zM13.6 4.5H17v15h-3.4z\" : \"M8.5 5v14l11-7z\",\n      labelHue: tr.hue, labelLight: tr.light,\n      heartFill: tr.id && this.favorites.has(tr.id) ? \"#c0392b\" : \"rgba(0,0,0,0.08)\",\n      toggle: () => this.togglePlayback(),\n      next: () => this.change((idx + 1) % this.lib.length),\n      prev: () => {\n        if (sec > 4) {\n          if (this.audio && this.audio.src) this.audio.currentTime = 0;\n          this.setState({ sec: 0 });\n        } else this.change((idx + this.lib.length - 1) % this.lib.length, null, \"back\");\n      },\n      like: () => this.toggleLike(),\n      seek: e => this.seekAudio(e),\n      setVol: e => this.setAudioVolume(e),\n      nextRows: [1, 2].map(k => this.row(this.lib[(idx + k) % this.lib.length], (idx + k) % this.lib.length)),\n      q, hasQ: query.length > 0,\n      onQ: e => this.scheduleSearch(e.target.value),\n      clearQ: () => this.scheduleSearch(\"\"),\n      chips: [\"Adele\", \"周杰伦\", \"Taylor Swift\", \"Coldplay\"].map(w => ({\n        w,\n        go: () => this.scheduleSearch(w)\n      })),\n      resultsLabel: this.state.searching\n        ? this.state.apiStatus\n        : (query ? \"搜索结果\" : (this.state.apiStatus || \"服务器曲库\")),\n      results: matches.map(([t, i]) => this.row(t, i)),\n      noResults: query.length > 0 && !this.state.searching && matches.length === 0,\n      emptyMessage: this.state.apiStatus || \"没有找到相关歌曲，换个关键词试试\",\n      favoriteCount: this.favorites.size,\n      playlistCount: this.pls.length,\n      libraryCount: this.lib.length,\n      playlists: this.pls.map((p, k) => ({\n        name: p.name, count: p.songs.length, c1: p.c1, c2: p.c2,\n        open: () => this.setState({ page: \"playlist\", plIdx: k })\n      })),\n      isPl: page === \"playlist\",\n      plName: pl.name, plCount: pl.songs.length, plC1: pl.c1, plC2: pl.c2,\n      plTotal: fmt(pl.songs.reduce((a, i) => a + this.lib[i].d, 0)),\n      plRows: pl.songs.map((i, n) => Object.assign(this.row(this.lib[i], i), { no: String(n + 1).padStart(2, \"0\") })),\n      backMe: () => this.setState({ page: \"me\" }),\n      playAll: () => pl.songs.length && this.change(pl.songs[0], { page: \"play\" })\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
